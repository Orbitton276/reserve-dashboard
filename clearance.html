<!doctype html>
<html lang="en" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserve Clearance</title>
<style>
  /* RG army green, same as the app: PRIMARY_COLOR #444C38 and PRIMARY_TINT */
  :root { --bg:#fff; --fg:#111; --muted:#666; --line:#e3e5df; --head:#444C38; --headfg:#fff; --card:#f6f7f4; --sub:rgba(68,76,56,.12); --ok:#3d7a37; --bad:#b42318; --store:#8a5a00; --storebg:rgba(245,158,11,.14); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121412; --fg:#eceee8; --muted:#a3a99a; --line:#2b2f27; --head:#444C38; --headfg:#fff; --card:#1b1e19; --sub:rgba(68,76,56,.35); --ok:#6fbf66; --bad:#f97066; --store:#f5b94a; --storebg:rgba(245,158,11,.16); }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
  header.site { background:var(--head); color:var(--headfg); }
  header.site .in { max-width:1000px; margin:0 auto; padding:0 16px; display:flex; align-items:center; gap:24px; height:52px; }
  header.site .brand { font-weight:700; font-size:18px; margin-inline-end:8px; }
  header.site a { color:rgba(255,255,255,.75); text-decoration:none; font-size:15px; height:100%; display:flex; align-items:center; border-bottom:3px solid transparent; }
  header.site a:hover { color:#fff; }
  header.site a.active { color:#fff; border-bottom-color:#fff; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  h2 { font-size:16px; margin:24px 0 8px; }
  .filters { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .filters .full { grid-column:1 / -1; }
  label.f { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  input[type=date], input[type=search], select { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  input:focus, select:focus { outline:2px solid var(--head); outline-offset:1px; }
  details.track { margin:12px 0; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  details.track summary { cursor:pointer; padding:10px 12px; font-weight:600; }
  details.track .inner { padding:0 12px 12px; }
  .tbtns { display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 10px; }
  .tbtns button { padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font-size:14px; cursor:pointer; }
  .tcols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .tcols h3 { font-size:13px; color:var(--muted); margin:0 0 6px; font-weight:600; }
  .tcols label { display:flex; gap:8px; align-items:center; padding:3px 0; font-size:15px; cursor:pointer; }
  .tiles { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:16px 0 8px; }
  .tile { background:var(--head); color:var(--headfg); border-radius:10px; padding:12px; text-align:center; }
  .tile.bad { background:var(--bad); }
  .tile b { display:block; font-size:28px; line-height:1.1; }
  .tile span { font-size:13px; opacity:.9; }
  .bar { height:10px; background:var(--sub); border-radius:99px; overflow:hidden; margin:8px 0; }
  .bar i { display:block; height:100%; background:var(--ok); }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:start; }
  th { font-size:13px; color:var(--muted); font-weight:600; }
  td.n { white-space:nowrap; font-variant-numeric:tabular-nums; }
  td .bar { margin:0; min-width:80px; }
  .miss { color:var(--bad); font-weight:600; }
  .group { margin:12px 0; border-radius:8px; overflow:hidden; border:1px solid var(--line); }
  .ghead { display:flex; justify-content:space-between; gap:12px; background:var(--head); color:var(--headfg); padding:10px 12px; font-weight:bold; }
  .group.store { border:2px solid var(--store); }
  .group.store .ghead { background:var(--store); color:#fff; }
  .group.store .ghead span:first-child::before { content:"\1F3E0  "; }
  .item { display:flex; justify-content:space-between; gap:12px; padding:9px 12px; border-top:1px solid var(--line); }
  .item small { color:var(--muted); }
  .loan { background:#7c3aed; color:#fff; font-weight:700; font-size:13px; padding:1px 8px; border-radius:6px; white-space:nowrap; align-self:center; }
  .item .reg { color:var(--store); font-weight:600; }
  .note { color:var(--muted); font-size:14px; margin:4px 0 8px; }
  .done { text-align:center; padding:24px; color:var(--ok); font-weight:600; }
  .empty, .error { text-align:center; color:var(--muted); padding:32px 0; }
  .error { color:var(--bad); }
  @media (max-width:640px) { .filters { grid-template-columns:1fr; } .tcols { grid-template-columns:1fr; } }

  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .tabs button { padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font-size:15px; cursor:pointer; }
  .tabs button.on { background:var(--head); color:var(--headfg); border-color:var(--head); }
  .st { font-weight:600; white-space:nowrap; }
  .st.open { color:var(--bad); } .st.clear { color:var(--ok); } .st.todo { color:var(--muted); } .st.holds { color:var(--store); }
  .over { color:var(--ok); }
  .gate { text-align:center; padding:40px 0; }
  .gate button { padding:12px 20px; font-size:16px; font-weight:700; border:0; border-radius:8px; background:var(--head); color:var(--headfg); cursor:pointer; }
  main a { color:var(--fg); }
  tr.go { cursor:pointer; }
  .mdep { display:none; color:var(--muted); }
  @media (max-width: 640px) {
    table.bd { display:table; width:100%; overflow:visible; }
    table.bd th:nth-child(2), table.bd td:nth-child(2),
    table.bd th:nth-child(4), table.bd td:nth-child(4),
    table.bd th:nth-child(5), table.bd td:nth-child(5) { display:none; }
    .tiles { grid-template-columns:repeat(2, 1fr) !important; }
    .mdep { display:block; font-size:12px; }
    table.bd td, table.bd th { padding:8px 6px; }
  }
  tr.go:hover td { background:var(--sub); }
  .btn { padding:10px 16px; font-size:15px; font-weight:700; border:0; border-radius:8px; background:var(--head); color:var(--headfg); cursor:pointer; }
  .btn.alt { background:var(--card); color:var(--fg); border:1px solid var(--line); font-weight:600; }
  .btn:disabled { opacity:.45; cursor:default; }
  .acts { display:flex; flex-wrap:wrap; gap:8px; padding:10px 12px; border-top:1px solid var(--line); }
  .item.child { padding-left:28px; } .item.child span { color:var(--muted); font-size:14px; }
  .item label { display:flex; gap:10px; align-items:center; cursor:pointer; }
  .item input[type=number] { width:80px; padding:6px 8px; font-size:15px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  .item.line { display:grid; grid-template-columns:1fr 70px 100px; align-items:center; gap:8px; }
  .item.line .c { text-align:center; font-variant-numeric:tabular-nums; }
  .item.line.hdr { font-size:13px; color:var(--muted); font-weight:600; padding-top:6px; padding-bottom:6px; }
  .item.line input[type=number] { width:80px; text-align:center; }
  .msg { padding:10px 12px; border-radius:8px; margin:10px 0; font-size:15px; }
  .msg.ok { background:var(--sub); color:var(--ok); } .msg.err { background:rgba(180,35,24,.12); color:var(--bad); }
  .hide { display:none; }
</style>
</head>
<body>
<header class="site"><div class="in">
  <span class="brand">Reserve</span>
  <a href="index.html">Inventory</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="check.html">Report</a>
  <a href="clearance.html" class="active">Clearance</a>
</div></header>
<main>
  <h1>Owner clearance</h1>
  <div id="gate" class="gate hide"><p class="note">Sign in to see who still holds equipment and what is short.</p><button type="button" id="gateBtn">Sign in</button></div>
  <div id="ownerView" class="hide"></div>
  <div id="app" class="hide">
    <div class="filters">
      <div><label class="f" for="inv">Inventory</label><select id="inv"></select></div>
      <div class="full"><input id="q" type="search" placeholder="Search owner or department" autocomplete="off"></div>
    </div>
    <div class="tabs" id="tabs">
      <button type="button" data-tab="owners" class="on">Owners</button>
      <button type="button" data-tab="shortages">Shortages</button>
      <button type="button" data-tab="losses">Losses</button>
      <span style="flex:1"></span>
      <button type="button" id="csv">Export shortages (CSV)</button>
    </div>
    <div id="view"><div class="empty">Loading...</div></div>
    <div class="note" id="updated"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const cmp = (a, b) => String(a ?? "").localeCompare(String(b ?? ""), "he");
  const fmt = d => d ? new Date(d).toLocaleDateString("en-GB") : "";

  const ownerId = Number(new URLSearchParams(location.search).get("owner")) || null;
  let invId = null, tab = "owners", statusFilter = "all";
  let owners = [], shortages = [], extras = [], losses = [];

  // Where one owner stands: an open shortage first, then still holding, then counted or clear.
  // `held_qty` is everything he holds here: serial units plus bulk quantity.
  function stateOf(o) {
    if (o.open_qty > 0) return { k: "open", label: "Short " + o.open_qty };
    if (o.held_qty > 0 && !o.last_counted_at) return { k: "todo", label: "Not counted" };
    if (o.held_qty > 0) return { k: "holds", label: o.last_kind === "return" ? "Returned part, still holds" : "Verified, still holds" };
    if (o.last_counted_at) return { k: "clear", label: "Clear" };
    return { k: "todo", label: "Not counted" };
  }

  // "Name x2, Other x6": serial units count one each, bulk lines count their quantity.
  function summarize(items, max) {
    const m = new Map();
    for (const i of items) m.set(i.name, (m.get(i.name) || 0) + i.n);
    const parts = [...m.entries()].sort((a, b) => b[1] - a[1] || cmp(a[0], b[0])).map(([n, q]) => `${n} x${q}`);
    return { text: parts.slice(0, max).join(", ") + (parts.length > max ? ` +${parts.length - max} more` : ""), full: parts.join(", ") };
  }

  function netRows() {
    const m = new Map();
    const get = (id, name) => { if (!m.has(id)) m.set(id, { name: name || "#" + id, missing: 0, extra: 0, short: [], over: [] }); return m.get(id); };
    for (const s of shortages) { const r = get(s.item_type_id, s.item_type); r.missing += s.open_qty; r.short.push(s); }
    for (const x of extras) { const r = get(x.item_type_id, x.item_type); r.extra += x.extra_qty; r.over.push(x); }
    return [...m.values()].map(r => ({ ...r, net: r.missing - r.extra })).sort((a, b) => b.net - a.net || cmp(a.name, b.name));
  }

  function renderOwners() {
    const q = $("q").value.trim().toLowerCase();
    const all = owners.map(o => ({ o, s: stateOf(o) }));
    const cnt = k => all.filter(x => x.s.k === k).length;
    const shown = all.filter(x => (statusFilter === "all" || x.s.k === statusFilter) &&
      (q.length < 2 || `${x.o.holder} ${x.o.department}`.toLowerCase().includes(q)));
    const opt = (k, t) => `<button type="button" data-st="${k}" class="${statusFilter === k ? "on" : ""}">${t}</button>`;
    return `
      <div class="tiles" style="grid-template-columns:repeat(4,1fr)">
        <div class="tile"><b>${all.length}</b><span>Owners</span></div>
        <div class="tile"><b>${cnt("clear")}</b><span>Clear</span></div>
        <div class="tile"><b>${cnt("holds") + cnt("todo")}</b><span>Holding / not counted</span></div>
        <div class="tile ${cnt("open") ? "bad" : ""}"><b>${cnt("open")}</b><span>Open shortage</span></div>
      </div>
      <div class="tabs" id="stf">${opt("all", "All")}${opt("open", "Short")}${opt("holds", "Holding")}${opt("todo", "Not counted")}${opt("clear", "Clear")}</div>
      <div class="note">Click an owner to count him or hand his items back.</div>
      <table class="bd"><thead><tr><th>Owner</th><th>Department</th><th>Holds now</th><th>Open shortage</th><th>Last count</th><th>Status</th></tr></thead><tbody>
      ${shown.sort((a, b) => cmp(a.o.holder, b.o.holder)).map(({ o, s }) => { const sm = summarize(o.items, 4); return `
        <tr class="go" data-owner="${o.holder_user_id}"><td><a href="clearance.html?owner=${o.holder_user_id}&inv=${invId}"><b>${esc(o.holder)}</b></a><small class="mdep">${esc(o.department)}</small></td><td>${esc(o.department)}</td>
        <td title="${esc(sm.full)}"><b>${o.held_qty}</b> <small style="color:var(--muted)">${esc(sm.text)}</small></td><td class="n ${o.open_qty ? "miss" : ""}">${o.open_qty || ""}</td>
        <td>${o.last_counted_at ? fmt(o.last_counted_at) + " · " + (o.last_kind === "return" ? "Return" : "Verify") : ""}</td>
        <td class="st ${s.k}">${esc(s.label)}</td></tr>`; }).join("") || `<tr><td colspan="6" class="empty">No rows</td></tr>`}
      </tbody></table>`;
  }

  function renderShortages() {
    const rows = netRows();
    if (!rows.length) return '<div class="done">No open shortages</div>';
    return rows.map(r => `
      <div class="group"><div class="ghead"><span>${esc(r.name)}</span><span>missing ${r.missing} · extra ${r.extra} · net ${r.net}</span></div>
        ${r.short.map(s => `<div class="item"><span>Short at ${esc(s.holder)} <small>${esc(s.department)}</small></span><span class="miss">${s.open_qty}</span></div>`).join("")}
        ${r.over.map(x => `<div class="item"><span class="over">Extra at ${esc(x.holder)}</span><span class="over">${x.extra_qty}</span></div>`).join("")}
      </div>`).join("");
  }

  function renderLosses() {
    const rows = losses.filter(l => l.lost_qty > 0);
    if (!rows.length) return '<div class="done">No losses recorded</div>';
    return `<table><thead><tr><th>Item</th><th>Owner</th><th>Lost</th><th>Found</th><th>Outstanding</th></tr></thead><tbody>` +
      rows.map(l => `<tr><td>${esc(l.item_type)}</td><td>${esc(l.holder)}</td><td class="n">${l.lost_qty}</td><td class="n">${l.found_qty}</td><td class="n ${l.outstanding_qty ? "miss" : ""}">${l.outstanding_qty}</td></tr>`).join("") + `</tbody></table>`;
  }

  function render() {
    $("view").innerHTML = tab === "owners" ? renderOwners() : tab === "shortages" ? renderShortages() : renderLosses();
    document.querySelectorAll("#tabs [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  }

  async function allLines(id) {
    const all = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await RS.db.from("inventory_lines").select("*").eq("inventory_id", id).order("id").range(from, from + 999);
      if (error) return { error };
      all.push(...data); if (data.length < 1000) break;
    }
    return { data: all };
  }

  async function load() {
    $("view").innerHTML = '<div class="empty">Loading...</div>';
    const a = { p_inventory_id: invId };
    const r = await Promise.all([RS.db.rpc("custody_owner_status", a), RS.db.rpc("custody_open_shortages", a),
                                 RS.db.rpc("custody_open_extras", a), RS.db.rpc("custody_losses", a),
                                 allLines(invId), RS.db.from("item_types").select("id,name"),
                                 RS.db.from("users").select("personal_id,first_name,last_name,department"),
                                 RS.db.from("departments").select("dep_id,dep_name")]);
    const bad = r.find(x => x.error);
    if (bad) { $("view").innerHTML = `<div class="error">Could not load data: ${esc(bad.error.message)}</div>`; return; }
    const [st, sh, ex, lo, lines, types, users, deps] = r.map(x => x.data || []);
    [shortages, extras, losses] = [sh, ex, lo];
    // Everyone who holds anything here, plus anyone with a count, with what they hold.
    const tname = new Map(types.map(t => [t.id, t.name])), dname = new Map(deps.map(d => [d.dep_id, d.dep_name]));
    const uname = new Map(users.map(u => [u.personal_id, u]));
    const byId = new Map(st.map(o => [o.holder_user_id, { ...o, held_qty: 0, items: [] }]));
    for (const l of lines) {
      if (l.holder_user_id == null || (l.kind === "bulk" && !(l.qty > 0))) continue;
      if (!byId.has(l.holder_user_id)) {
        const u = uname.get(l.holder_user_id);
        byId.set(l.holder_user_id, { holder_user_id: l.holder_user_id, holder: u ? `${u.first_name ?? ""} ${u.last_name ?? ""}`.trim() : "#" + l.holder_user_id,
          department: u ? dname.get(u.department) : null, held_qty: 0, last_counted_at: null, last_kind: null, open_qty: 0, items: [] });
      }
      const o = byId.get(l.holder_user_id), n = l.kind === "serial" ? 1 : l.qty;
      o.held_qty += n; o.items.push({ name: tname.get(l.item_type_id) || "#" + l.item_type_id, n });
    }
    owners = [...byId.values()];
    render();
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString("en-GB");
  }


  // One owner, across every inventory: reached from an owner header or an item on the
  // Inventory and Report pages.
  const ACTION = {issue:"Issued",return:"Returned",transfer:"Transferred",consume:"Consumed",adjust:"Adjusted",receive:"Received",opening:"Opening",edit:"Edited",loss:"Lost",found:"Found"};
  // Short counts come from the count history; movements come from the ledger, which only
  // admins may read, so other roles simply do not get that table.
  async function loadHistory(invIdForHistory) {
    const [counts, ledger] = await Promise.all([
      RS.db.rpc("custody_count_history", { p_inventory_id: invIdForHistory, p_holder: ownerId }),
      RS.me?.role === "admin"
        ? RS.db.from("ledger_view").select("performed_at,action,item_type_name,unit_serial,qty,from_user_id,from_user_name,to_user_id,to_user_name,performed_by_name,notes")
            .eq("inventory_id", invIdForHistory).or(`from_user_id.eq.${ownerId},to_user_id.eq.${ownerId}`).order("performed_at", { ascending: false }).limit(100)
        : Promise.resolve({ data: null }),
    ]);
    const c = counts.data || [], l = ledger.data;
    let html = "";
    if (c.length) {
      html += `<h2>Counts that came up off</h2><table><thead><tr><th>Date</th><th>Kind</th><th>Item</th><th>Expected</th><th>Counted</th><th>Counted by</th></tr></thead><tbody>` +
        c.map(r => `<tr><td>${fmt(r.counted_at)}</td><td>${r.kind === "return" ? "Return" : "Verify"}</td><td>${esc(r.item_type)}</td><td class="n">${r.expected_qty}</td><td class="n ${r.short_qty ? "miss" : ""}">${r.counted_qty}</td><td>${esc(r.counted_by_name)}</td></tr>`).join("") + `</tbody></table>`;
    }
    if (l) {
      html += `<details class="track"><summary>Movements (${l.length}${l.length === 100 ? "+" : ""})</summary><div class="inner">` +
        (l.length ? `<table><thead><tr><th>Date</th><th>Action</th><th>Item</th><th>From</th><th>To</th><th>By</th></tr></thead><tbody>` +
          l.map(r => `<tr><td>${fmt(r.performed_at)}</td><td>${esc(ACTION[r.action] || r.action)}</td><td>${esc(r.item_type_name)}${r.unit_serial ? " #" + esc(r.unit_serial) : r.qty ? " x" + r.qty : ""}</td><td>${esc(r.from_user_name)}</td><td>${esc(r.to_user_name)}</td><td>${esc(r.performed_by_name)}</td></tr>`).join("") + `</tbody></table>` : '<div class="empty">No movements</div>') +
        `</div></details>`;
    }
    const box = $("history"); if (box) box.innerHTML = html;
  }

  // The owner page works inside ONE inventory, like the desk does. With no ?inv= it opens on
  // the only inventory he holds something in, or asks which one.
  const invParam = new URLSearchParams(location.search).get("inv");
  const resolveInv = list => !invParam ? null
    : list.find(i => String(i.id) === invParam || i.label === invParam || i.code === invParam) || null;

  async function showOwner() {
    const box = $("ownerView");
    box.innerHTML = '<div class="empty">Loading...</div>';
    const [invs, who, allShort] = await Promise.all([
      RS.db.from("inventories").select("id,code,label,sort_ord").order("sort_ord"),
      RS.db.from("users").select("first_name,last_name,department").eq("personal_id", ownerId).maybeSingle(),
      RS.db.rpc("custody_open_shortages", { p_inventory_id: null }),
    ]);
    if (invs.error) { box.innerHTML = `<div class="error">Could not load data: ${esc(invs.error.message)}</div>`; return; }
    const name = who.data ? `${who.data.first_name ?? ""} ${who.data.last_name ?? ""}`.trim() : "#" + ownerId;
    try { await loadHoldings(invs.data); } catch (err) { H = null; }
    if (!H) { box.innerHTML = '<div class="error">Could not load holdings.</div>'; return; }
    const heldIn = id => H.lines.filter(l => l.inventory_id === id).reduce((n, l) => n + (l.kind === "serial" ? 1 : l.qty), 0);
    const shortIn = id => (allShort.data || []).filter(x => x.holder_user_id === ownerId && x.inventory_id === id).reduce((n, x) => n + x.open_qty, 0);
    const involved = invs.data.filter(i => heldIn(i.id) > 0 || shortIn(i.id) > 0);
    const head = `<h2 style="margin-top:0"><span id="ownerName">${esc(name)}</span> <small style="color:var(--muted);font-weight:400">#${ownerId}</small></h2>`;

    let target = resolveInv(invs.data) || (involved.length === 1 ? involved[0] : null);
    if (!target) {
      box.innerHTML = `<p class="note"><a href="clearance.html">&lsaquo; All owners</a></p>${head}` + (involved.length
        ? `<div class="note">He holds items in more than one inventory. Choose where you are working:</div>` +
          involved.map(i => `<a class="group" style="display:block;text-decoration:none" href="clearance.html?owner=${ownerId}&inv=${i.id}"><div class="ghead"><span>${esc(i.label || i.code)}</span><span>${heldIn(i.id)} held${shortIn(i.id) ? ` · ${shortIn(i.id)} short` : ""}</span></div></a>`).join("")
        : '<div class="empty">He holds nothing in any inventory.</div>');
      return;
    }

    // only this inventory from here on
    H.invs = new Map([[target.id, target]]);
    const [st, sh] = await Promise.all([
      RS.db.rpc("custody_owner_status", { p_inventory_id: target.id }),
      RS.db.rpc("custody_open_shortages", { p_inventory_id: target.id }),
    ]);
    const o = { held_qty: heldIn(target.id), open_qty: 0, last_counted_at: null, last_kind: null, ...((st.data || []).find(r => r.holder_user_id === ownerId) || {}), held_qty: heldIn(target.id) };
    const mine = (sh.data || []).filter(x => x.holder_user_id === ownerId);
    const stt = stateOf(o);
    const others = involved.filter(i => i.id !== target.id);
    box.innerHTML = `
      <p class="note"><a href="clearance.html?inv=${target.id}">&lsaquo; All owners in ${esc(target.label || target.code)}</a></p>
      ${head}
      <div class="note"><b>${esc(target.label || target.code)}</b> · ${o.held_qty ? `holds ${o.held_qty} item(s)` : "holds nothing"} · <span class="st ${stt.k}">${esc(stt.label)}</span>${o.last_counted_at ? ` · last count ${fmt(o.last_counted_at)} (${o.last_kind === "return" ? "return" : "verify"})` : ""}</div>
      ${others.length ? `<div class="note">Also holds in: ${others.map(i => `<a href="clearance.html?owner=${ownerId}&inv=${i.id}">${esc(i.label || i.code)}</a>`).join(", ")}</div>` : ""}
      ${mine.length ? `<h2>Open shortages</h2>` + mine.map(x => `<div class="item"><span>${esc(x.item_type)}</span><span class="miss">${x.open_qty}</span></div>`).join("") : ""}
      <div id="hand"></div>
      <div id="history"></div>`;
    loadHistory(target.id);
    renderHand();
    handMsg = null;
  }

  // ---- Hand back (withdraw an owner from his items) --------------------------------------
  // Per inventory, like the desk works. Everything starts ticked; untick what he did not bring
  // or lower a quantity. Bulk goes through a return count (records expected vs returned, so a
  // short return stays visible), serial units through return_batch. A weapon takes its mounted
  // items back with it, so those are shown but never picked on their own.
  let H = null;            // { lines, names, invs }
  let sel = {};            // invId -> { units:Set, qty:{typeId:n} }
  let handMsg = null;
  let mode = "return";    // "return" = hand back, "verify" = count only (bulk items; weapons keep the daily check)

  async function loadHoldings(invs) {
    const [l, t] = await Promise.all([
      RS.db.from("inventory_lines").select("*").eq("holder_user_id", ownerId),
      RS.db.from("item_types").select("id,name"),
    ]);
    if (l.error) throw l.error;
    const names = new Map((t.data || []).map(x => [x.id, x.name]));
    const lines = (l.data || []).filter(r => r.kind === "serial" || (r.qty ?? 0) > 0);
    H = { lines, names, invs: new Map(invs.map(i => [i.id, i])) };
    sel = {};
    for (const [invId] of H.invs) {
      const mine = lines.filter(r => r.inventory_id === invId);
      const unitIds = new Set(mine.filter(r => r.kind === "serial").map(r => r.id));
      sel[invId] = {
        units: new Set(mine.filter(r => r.kind === "serial" && !(r.parent_unit_id != null && unitIds.has(r.parent_unit_id))).map(r => r.id)),
        qty: Object.fromEntries(mine.filter(r => r.kind === "bulk" && r.parent_unit_id == null).map(r => [r.item_type_id, r.qty])),
      };
    }
  }

  const nm = r => H.names.get(r.item_type_id) || "#" + r.item_type_id;

  function renderHand() {
    const box = $("hand");
    if (!H) { box.innerHTML = ""; return; }
    const msg = handMsg ? `<div class="msg ${handMsg.ok ? "ok" : "err"}">${esc(handMsg.text)}</div>` : "";
    const cards = [...H.invs.values()].map(inv => {
      const mine = H.lines.filter(r => r.inventory_id === inv.id);
      if (!mine.length) return "";
      const s = sel[inv.id];
      const units = mine.filter(r => r.kind === "serial");
      const top = units.filter(u => !(u.parent_unit_id != null && units.some(p => p.id === u.parent_unit_id)));
      const loose = mine.filter(r => r.kind === "bulk" && r.parent_unit_id == null);
      const mounted = mine.filter(r => r.kind === "bulk" && r.parent_unit_id != null);
      const kids = id => units.filter(u => u.parent_unit_id === id);
      const withIt = id => mounted.filter(m => m.parent_unit_id === id);
      const dis = RS.canWrite ? "" : "disabled";
      const hdr = `<div class="item line hdr"><span></span><span class="c">Holds</span><span class="c">${mode === "verify" ? "Counted" : "Returned"}</span></div>`;
      const rows = hdr + top.sort((a, b) => cmp(nm(a), nm(b))).map(u => `
        <div class="item line"><label><input type="checkbox" data-unit="${inv.id}:${u.id}" ${s.units.has(u.id) ? "checked" : ""} ${dis}>
          <span>${esc(nm(u))} <small>#${esc(u.serial)}</small>${u.issued_at ? "" : " <small>listed, not handed over</small>"}</span></label>
          <span class="c">1</span><span class="c"></span></div>` +
        kids(u.id).map(k => `<div class="item child"><span>with it: ${esc(nm(k))} <small>#${esc(k.serial)}</small></span></div>`).join("") +
        withIt(u.id).map(m => `<div class="item child"><span>with it: ${esc(nm(m))} x${m.qty}</span></div>`).join("")).join("") +
        loose.sort((a, b) => cmp(nm(a), nm(b))).map(b => {
          const q = s.qty[b.item_type_id] ?? 0;
          return `<div class="item line"><label><input type="checkbox" data-bulk="${inv.id}:${b.item_type_id}" ${q > 0 ? "checked" : ""} ${dis}>
            <span>${esc(nm(b))}${b.issued_qty > 0 && b.issued_qty < b.qty ? ` <small>handed over ${b.issued_qty}</small>` : ""}</span></label>
            <span class="c">${b.qty}</span>
            <span class="c">${q > 0 ? `<input type="number" min="0" max="${b.qty}" value="${q}" data-qty="${inv.id}:${b.item_type_id}" ${dis}>` : "&mdash;"}</span></div>`;
        }).join("");
      const nUnits = s.units.size, nBulk = Object.values(s.qty).filter(v => v > 0).length;
      return `<div class="group"><div class="ghead"><span>${esc(inv.label || inv.code)}</span><span>${mine.length}</span></div>${rows}
        <div class="acts">${mode === "verify"
          ? `<button class="btn" data-verify="${inv.id}" ${RS.canWrite ? "" : "disabled"}>Save count: ${nUnits} unit(s) seen, ${nBulk} bulk line(s)</button>`
          : `<button class="btn" data-hand="${inv.id}" ${RS.canWrite ? "" : "disabled"}>Hand back ${nUnits} unit(s), ${nBulk} bulk line(s)</button>
          <button class="btn alt" data-unmark="${inv.id}" ${RS.canWrite ? "" : "disabled"} title="He keeps them on his list but they are no longer marked as handed over">Take back, keep listed</button>`}
        </div></div>`;
    }).join("");
    const modeNote = !RS.canWrite ? "View only for your role. Hand-back and counts are for admin and M4."
      : mode === "verify" ? "Nothing moves. Every item starts ticked as seen. Untick what he did not show, or lower a quantity. Ticked weapons are marked as seen today on the Report page; a lower bulk count is recorded as a shortage."
      : "Every item starts ticked as returned. Untick what he did not bring, or lower a quantity: whatever is left stays on his name and shows as a shortage.";
    box.innerHTML = `<h2>${mode === "verify" ? "Verify count" : "Hand back"}</h2>
      <div class="tabs"><button type="button" data-mode="return" class="${mode === "return" ? "on" : ""}">Hand back</button><button type="button" data-mode="verify" class="${mode === "verify" ? "on" : ""}">Verify count</button></div>
      <div class="note">${modeNote}</div>
      ${msg}${cards || '<div class="empty">He holds nothing.</div>'}`;
  }

  async function handBack(invId) {
    const s = sel[invId], inv = H.invs.get(invId);
    const mine = H.lines.filter(r => r.inventory_id === invId);
    const loose = mine.filter(r => r.kind === "bulk" && r.parent_unit_id == null);
    const mounted = mine.filter(r => r.kind === "bulk" && r.parent_unit_id != null);
    const exceptions = [];
    for (const b of loose) {
      const n = Number(s.qty[b.item_type_id] ?? 0);
      if (n !== b.qty) exceptions.push({ item_type_id: b.item_type_id, counted_qty: n });
    }
    // a mounted line follows its weapon: if the weapon stays, so does what is on it
    for (const m of mounted) {
      if (!s.units.has(m.parent_unit_id)) exceptions.push({ item_type_id: m.item_type_id, parent_unit_id: m.parent_unit_id, counted_qty: 0 });
    }
    const unitIds = [...s.units];
    const left = mine.filter(r => r.kind === "serial" && !s.units.has(r.id) && !(r.parent_unit_id != null && s.units.has(r.parent_unit_id))).length;
    const short = exceptions.reduce((n, e) => n + (loose.find(b => b.item_type_id === e.item_type_id && e.parent_unit_id == null)?.qty ?? 0) - e.counted_qty, 0);
    const ok = confirm(`Hand back from ${$("ownerName").textContent} in ${inv.label || inv.code}?\n\n` +
      `Units returned: ${unitIds.length}\nUnits staying on him: ${left}\nBulk lines short: ${exceptions.length}\n\n` +
      `This changes live data.`);
    if (!ok) return;
    handMsg = null; renderHand();
    const c = await RS.db.rpc("save_custody_count", { p_inventory_id: invId, p_holder: ownerId, p_kind: "return", p_counts: exceptions });
    if (c.error) { handMsg = { ok: false, text: "Count not saved, nothing changed: " + c.error.message }; renderHand(); return; }
    if (unitIds.length) {
      const r = await RS.db.rpc("return_batch", { p_from_user: ownerId, p_inventory_id: invId, p_unit_ids: unitIds, p_type_ids: [], p_qtys: [], p_notes: "web hand back" });
      if (r.error) { handMsg = { ok: false, text: "Bulk items were counted and returned, but the units failed: " + r.error.message }; await showOwner(); return; }
    }
    handMsg = { ok: true, text: `Done in ${inv.label || inv.code}: ${unitIds.length} unit(s) returned${exceptions.length ? `, ${exceptions.length} line(s) recorded short` : ""}.` };
    await showOwner();
  }

  async function saveVerify(invId) {
    const s = sel[invId], inv = H.invs.get(invId);
    const mine = H.lines.filter(r => r.inventory_id === invId);
    const loose = mine.filter(r => r.kind === "bulk" && r.parent_unit_id == null);
    const mounted = mine.filter(r => r.kind === "bulk" && r.parent_unit_id != null);
    const topUnits = mine.filter(r => r.kind === "serial" && !(r.parent_unit_id != null && mine.some(p => p.kind === "serial" && p.id === r.parent_unit_id)));
    const exceptions = [];
    for (const b of loose) {
      const n = Number(s.qty[b.item_type_id] ?? 0);
      if (n !== b.qty) exceptions.push({ item_type_id: b.item_type_id, counted_qty: n });
    }
    // what is mounted on a weapon he did not show was not shown either
    for (const m of mounted) {
      if (!s.units.has(m.parent_unit_id)) exceptions.push({ item_type_id: m.item_type_id, parent_unit_id: m.parent_unit_id, counted_qty: 0 });
    }
    const seen = [...s.units], notSeen = topUnits.length - seen.length;
    if (!confirm(`Save a verify count for ${$("ownerName").textContent} in ${inv.label || inv.code}?\n\n` +
      `Weapons/units marked as seen today: ${seen.length}${notSeen ? ` (${notSeen} not shown)` : ""}\n` +
      `Bulk lines counted: ${loose.length}, differing from the books: ${exceptions.length}\n\nNothing moves. This writes a permanent count record.`)) return;
    handMsg = null; renderHand();
    const c = await RS.db.rpc("save_custody_count", { p_inventory_id: invId, p_holder: ownerId, p_kind: "verify", p_counts: exceptions });
    if (c.error) { handMsg = { ok: false, text: "Count not saved: " + c.error.message }; renderHand(); return; }
    if (seen.length) {
      const today = new Date().toLocaleDateString("en-CA");
      const t = await RS.db.from("daily_report").upsert(seen.map(id => ({ report_date: today, unit_id: id, reporter_id: RS.me.id })), { onConflict: "report_date,unit_id", ignoreDuplicates: true });
      if (t.error) { handMsg = { ok: false, text: "Bulk count saved, but marking the units as seen failed: " + t.error.message }; await showOwner(); return; }
    }
    handMsg = { ok: true, text: `Count saved for ${inv.label || inv.code}: ${seen.length} unit(s) marked as seen${exceptions.length ? `, ${exceptions.length} bulk line(s) differ from the books` : ", bulk items all matched"}.` };
    await showOwner();
  }

  async function takeBackKeepListed(invId) {
    const inv = H.invs.get(invId);
    if (!confirm(`Mark everything ${$("ownerName").textContent} holds in ${inv.label || inv.code} as not handed over?\nHe stays listed as the holder; nothing moves. No history row is written.\n\nThis changes live data.`)) return;
    const r = await RS.db.rpc("unmark_holder_issued", { p_inventory_id: invId, p_user: ownerId });
    handMsg = r.error ? { ok: false, text: r.error.message } : { ok: true, text: `${r.data} item(s) are no longer marked as handed over.` };
    await showOwner();
  }

  document.addEventListener("change", e => {
    const u = e.target.closest("[data-unit]"), q = e.target.closest("[data-qty]"), bk = e.target.closest("[data-bulk]");
    if (bk) {
      const [i, t] = bk.dataset.bulk.split(":").map(Number); const held = H.lines.find(l => l.inventory_id === i && l.kind === "bulk" && l.parent_unit_id == null && l.item_type_id === t).qty;
      const st = sel[i]; st.last = st.last || {};
      if (bk.checked) st.qty[t] = st.last[t] > 0 ? st.last[t] : held; else { st.last[t] = st.qty[t]; st.qty[t] = 0; }
      renderHand();
    }
    if (u) { const [i, id] = u.dataset.unit.split(":").map(Number); u.checked ? sel[i].units.add(id) : sel[i].units.delete(id); renderHand(); }
    if (q) { const [i, t] = q.dataset.qty.split(":").map(Number); const max = Number(q.max); sel[i].qty[t] = Math.max(0, Math.min(max, Math.floor(Number(q.value) || 0))); renderHand(); }
  });
  document.addEventListener("click", e => {
    const h = e.target.closest("[data-hand]"), k = e.target.closest("[data-unmark]");
    const v = e.target.closest("[data-verify]"), m = e.target.closest("[data-mode]");
    if (h) handBack(Number(h.dataset.hand)); if (k) takeBackKeepListed(Number(k.dataset.unmark));
    if (v) saveVerify(Number(v.dataset.verify));
    if (m) { mode = m.dataset.mode; handMsg = null; renderHand(); }
  });

  async function show(session) {
    $("gate").classList.toggle("hide", !!session);
    $("app").classList.toggle("hide", !session || !!ownerId);
    $("ownerView").classList.toggle("hide", !session || !ownerId);
    if (!session) return;
    if (ownerId) { showOwner(); return; }
    const { data, error } = await RS.db.from("inventories").select("id,code,label,sort_ord").order("sort_ord");
    if (error) { $("view").innerHTML = `<div class="error">${esc(error.message)}</div>`; return; }
    $("inv").innerHTML = data.map(i => `<option value="${i.id}">${esc(i.label || i.code)}</option>`).join("");
    const pick = resolveInv(data) || data.find(i => i.code === "emergency") || data[0];
    if (pick) { $("inv").value = pick.id; invId = pick.id; load(); }
  }

  $("gateBtn").addEventListener("click", () => RS.open());
  $("inv").addEventListener("change", () => { invId = Number($("inv").value); statusFilter = "all"; history.replaceState(null, "", "?inv=" + invId); load(); });
  $("q").addEventListener("input", () => { if (tab === "owners") render(); });
  $("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; render(); } });
  // the whole row opens the owner; the name stays a real link for keyboard and open-in-new-tab
  $("view").addEventListener("click", e => {
    const row = e.target.closest("tr[data-owner]");
    if (row && !e.target.closest("a")) location.href = "clearance.html?owner=" + row.dataset.owner + "&inv=" + invId;
  });
  $("view").addEventListener("click", e => { const b = e.target.closest("[data-st]"); if (b) { statusFilter = b.dataset.st; render(); } });
  $("csv").addEventListener("click", () => {
    const rows = [["Item", "Owner", "Missing"]].concat(shortages.map(s => [s.item_type, s.holder, s.open_qty]));
    const csv = "\ufeff" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = "shortages.csv"; a.click();
  });
  // the first call comes from auth.js once it knows whether anyone is signed in
  RS.onChange(show);
</script>
</body>
</html>
