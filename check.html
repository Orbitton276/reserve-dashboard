<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דיווח יומי</title>
<style>
  /* RG army green, same as the app: PRIMARY_COLOR #444C38 and PRIMARY_TINT */
  :root { --bg:#fff; --fg:#111; --muted:#666; --line:#e3e5df; --head:#444C38; --headfg:#fff; --card:#f6f7f4; --sub:rgba(68,76,56,.12); --ok:#3d7a37; --bad:#b42318; --store:#8a5a00; --storebg:rgba(245,158,11,.14); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121412; --fg:#eceee8; --muted:#a3a99a; --line:#2b2f27; --head:#444C38; --headfg:#fff; --card:#1b1e19; --sub:rgba(68,76,56,.35); --ok:#6fbf66; --bad:#f97066; --store:#f5b94a; --storebg:rgba(245,158,11,.16); }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
  header.site { background:var(--head); color:var(--headfg); }
  header.site .in { max-width:1000px; margin:0 auto; padding:0 16px; display:flex; align-items:center; gap:24px; height:52px; }
  header.site .brand { font-weight:700; font-size:18px; margin-inline-end:8px; }
  header.site a { color:rgba(255,255,255,.75); text-decoration:none; font-size:15px; height:100%; display:flex; align-items:center; border-bottom:3px solid transparent; }
  header.site a:hover { color:#fff; }
  header.site a.active { color:#fff; border-bottom-color:#fff; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  h2 { font-size:16px; margin:24px 0 8px; }
  .filters { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .filters .full { grid-column:1 / -1; }
  label.f { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  input[type=date], input[type=search], select { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  input:focus, select:focus { outline:2px solid var(--head); outline-offset:1px; }
  details.track { margin:12px 0; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  details.track summary { cursor:pointer; padding:10px 12px; font-weight:600; }
  details.track .inner { padding:0 12px 12px; }
  .tbtns { display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 10px; }
  .tbtns button { padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font-size:14px; cursor:pointer; }
  .tcols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .tcols h3 { font-size:13px; color:var(--muted); margin:0 0 6px; font-weight:600; }
  .tcols label { display:flex; gap:8px; align-items:center; padding:3px 0; font-size:15px; cursor:pointer; }
  .tiles { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:16px 0 8px; }
  .tile { background:var(--head); color:var(--headfg); border-radius:10px; padding:12px; text-align:center; }
  .tile.bad { background:var(--bad); }
  .tile b { display:block; font-size:28px; line-height:1.1; }
  .tile span { font-size:13px; opacity:.9; }
  .bar { height:10px; background:var(--sub); border-radius:99px; overflow:hidden; margin:8px 0; }
  .bar i { display:block; height:100%; background:var(--ok); }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:start; }
  th { font-size:13px; color:var(--muted); font-weight:600; }
  td.n { white-space:nowrap; font-variant-numeric:tabular-nums; }
  td .bar { margin:0; min-width:80px; }
  .miss { color:var(--bad); font-weight:600; }
  .group { margin:12px 0; border-radius:8px; overflow:hidden; border:1px solid var(--line); }
  .ghead a.go { color:inherit; font-weight:600; font-size:13px; text-decoration:underline; white-space:nowrap; }
  .item a.lk { color:inherit; text-decoration:none; }
  .item a.lk:hover { text-decoration:underline; }
  .ghead { display:flex; justify-content:space-between; gap:12px; background:var(--head); color:var(--headfg); padding:10px 12px; font-weight:bold; }
  .group.store { border:2px solid var(--store); }
  .group.store .ghead { background:var(--store); color:#fff; }
  .group.store .ghead span:first-child::before { content:"\1F3E0  "; }
  .item { display:flex; justify-content:space-between; gap:12px; padding:9px 12px; border-top:1px solid var(--line); }
  .item small { color:var(--muted); }
  .loan { background:#7c3aed; color:#fff; font-weight:700; font-size:13px; padding:1px 8px; border-radius:6px; white-space:nowrap; align-self:center; }
  .item .reg { color:var(--store); font-weight:600; }
  .note { color:var(--muted); font-size:14px; margin:4px 0 8px; }
  .done { text-align:center; padding:24px; color:var(--ok); font-weight:600; }
  .empty, .error { text-align:center; color:var(--muted); padding:32px 0; }
  .error { color:var(--bad); }
  @media (max-width:640px) { .filters { grid-template-columns:1fr; } .tcols { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header class="site"><div class="in">
  <span class="brand">מילואים</span>
  <a href="index.html">מלאי</a>
  <a href="dashboard.html">כללי</a>
  <a href="check.html" class="active">דיווח יומי</a>
  <a href="clearance.html">ציוד לפי בעלים</a>
</div></header>
<main>
  <h1>בדיקת קיום</h1>
  <div class="filters">
    <div><label class="f" for="since">דווח לפחות פעם אחת מאז</label><input id="since" type="date"></div>
    <div><label class="f" for="dep">מחלקה</label><select id="dep"><option value="">כל המחלקות</option></select></div>
    <div><label class="f" for="inv">מלאי</label><select id="inv"><option value="">כל המלאים</option></select></div>
    <div class="full"><input id="q" type="search" placeholder="חיפוש בעלים, מחלקה, פריט או מספר סידורי" autocomplete="off"></div>
  </div>

  <details class="track" id="trackBox">
    <summary id="trackSummary">פריטים במעקב</summary>
    <div class="inner">
      <div class="tbtns">
        <button type="button" id="selSerial">הכול (ברירת מחדל)</button>
        <button type="button" id="selAll">הכול</button>
        <button type="button" id="selNone">כלום</button>
      </div>
      <div class="tcols">
        <div><h3>עם מספר סידורי</h3><div id="tSerial"></div></div>
        <div><h3>ללא מספר סידורי (אימות לפי ספירת בעלים)</h3><div id="tBulk"></div></div>
      </div>
    </div>
  </details>

  <div class="tiles" id="tiles"></div>
  <div class="bar"><i id="fill" style="width:0"></i></div>
  <div class="note"><span id="meta"></span> · <span id="updated"></span></div>

  <div id="body"><div class="empty">טוען…</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // Publishable key is public by design. It can only read the unit_report_check_v view.
  const SUPABASE_URL = "https://bqibfhhhthfzawzkpsdr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_NYRPrV7chJz-X5MTfyTr9Q_caqJ7A4v";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const REFRESH_MS = 60000;
  let lastOk = "", lastAt = 0;
  const clock = () => new Date().toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  const STORE = "במחסן";
  const NO_INV = "אחר";
  const LS_KEY = "reserve.check.tracked.v1";
  const $ = id => document.getElementById(id);
  let rows = [];           // serial units, from unit_report_check_v
  let bulkRows = [];       // non-serial lines, from inventory_holdings_v (counts only)
  let types = [];          // [{id, name, tracking}], id = "s|name" or "b|name"
  let stockById = new Map(); // 's<id>' -> stock line, to match a row to its owner counts
  let latestCount = new Map(); // line key -> latest owner count (signed in only)
  let sel = {};            // item_type_id -> true/false; absent = default (serial on, non-serial off)

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const cmp = (a, b) => String(a ?? "").localeCompare(String(b ?? ""), "he");
  const pct = (a, b) => b ? Math.round((a / b) * 100) : 0;
  // Where to look: in the holder's hands, or in storage (nobody holds it, or listed but never handed over).
  const inStore = r => r.custody === "store" || r.custody === "listed";

  function loadSel() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } }
  function saveSel() { try { localStorage.setItem(LS_KEY, JSON.stringify(sel)); } catch {} }
  const isTracked = t => (t.id in sel) ? !!sel[t.id] : true;

  // Keeps the current choice when the options are rebuilt on an auto refresh.
  function fillSelect(el, values) {
    const cur = el.value;
    const first = el.options[0];
    el.innerHTML = ""; el.appendChild(first);
    [...new Set(values.filter(Boolean))].sort(cmp).forEach(v => {
      const o = document.createElement("option"); o.value = v; o.textContent = v; el.appendChild(o);
    });
    if ([...el.options].some(o => o.value === cur)) el.value = cur;
  }

  // Default start date is 15/11 of the current year. A saved choice wins over it.
  function defaultSince() { return `${new Date().getFullYear()}-11-15`; }

  const PREFS_KEY = "reserve.check.prefs.v1";
  function loadPrefs() { try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch { return {}; } }
  function savePrefs() {
    try { localStorage.setItem(PREFS_KEY, JSON.stringify({ since: $("since").value, dep: $("dep").value, inv: $("inv").value })); } catch {}
  }

  // A bulk row is verified when its line has an owner count on or after the date. Store lines
  // have no owner and are not counted this way, so they return null.
  const lineKey = s => `${s.inventory_id}:${s.item_type_id}:${s.holder_user_id}:${s.parent_unit_id ?? ""}`;
  function countOf(r, since) {
    const s = stockById.get(r.row_id);
    if (!s || s.holder_user_id == null) return null;
    const c = latestCount.get(lineKey(s));
    if (!c || String(c.counted_at).slice(0, 10) < since) return { ok: false, short: false };
    return { ok: true, short: c.counted_qty < c.expected_qty };
  }

  const reported = (r, since) => !!r.last_report_date && r.last_report_date >= since;

  function renderTrackPanel() {
    const box = (t) => `<label><input type="checkbox" data-id="${t.id}" ${isTracked(t) ? "checked" : ""}> ${esc(t.name)}</label>`;
    $("tSerial").innerHTML = types.filter(t => t.tracking === "serial").map(box).join("") || '<div class="note">אין</div>';
    $("tBulk").innerHTML = types.filter(t => t.tracking !== "serial").map(box).join("") || '<div class="note">אין</div>';
    $("trackSummary").textContent = `פריטים במעקב (${types.filter(isTracked).length} מתוך ${types.length} סוגים)`;
  }

  function summaryRows(list, keyFn, since) {
    const m = new Map();
    for (const r of list) {
      const k = keyFn(r);
      if (!m.has(k)) m.set(k, { ok: 0, total: 0 });
      const g = m.get(k); g.total++; if (reported(r, since)) g.ok++;
    }
    return [...m.entries()].sort((a, b) => (a[0] === STORE ? -1 : b[0] === STORE ? 1 : cmp(a[0], b[0]))).map(([k, g]) => `
      <tr><td>${esc(k)}</td><td class="n">${g.ok} / ${g.total}</td>
          <td class="n ${g.total - g.ok ? "miss" : ""}">${g.total - g.ok}</td>
          <td style="width:30%"><div class="bar"><i style="width:${pct(g.ok, g.total)}%"></i></div></td></tr>`).join("");
  }

  function render() {
    const since = $("since").value;
    const dep = $("dep").value, inv = $("inv").value;
    if (!since) { $("body").innerHTML = '<div class="empty">בחרו תאריך</div>'; return; }

    const trackedIds = new Set(types.filter(isTracked).map(t => t.id));
    const q = $("q").value.trim().toLowerCase();
    const matchesQ = r => q.length < 2 || [r.owner_id, r.owner_name, r.owner_dep, r.item_name, r.serial]
      .some(v => String(v ?? "").toLowerCase().includes(q));
    const passes = r => (!dep || r.owner_dep === dep) && (!inv || (r.inventory_label ?? NO_INV) === inv) && matchesQ(r);
    const list = rows.filter(r => trackedIds.has("s|" + r.item_name) && passes(r));
    const bulk = bulkRows.filter(r => trackedIds.has("b|" + r.item_name) && passes(r));
    const ok = list.filter(r => reported(r, since));
    const missing = list.filter(r => !reported(r, since));

    $("tiles").innerHTML =
      `<div class="tile"><b>${list.length}</b><span>סה״כ פריטים</span></div>
       <div class="tile"><b>${ok.length}</b><span>דווחו</span></div>
       <div class="tile ${missing.length ? "bad" : ""}"><b>${missing.length}</b><span>לא דווחו</span></div>`;
    $("fill").style.width = pct(ok.length, list.length) + "%";
    $("meta").textContent = `${pct(ok.length, list.length)}% דווחו מאז ${since}`;

    let html = "";
    if (list.length) {
      const tableHead = first => `<table><thead><tr><th>${first}</th><th>דווחו</th><th>חסרים</th><th></th></tr></thead><tbody>`;
      html += `<h2>לפי מלאי</h2>${tableHead("מלאי")}${summaryRows(list, r => r.inventory_label ?? NO_INV, since)}</tbody></table>`;
      html += `<h2>לפי מיקום</h2><div class="note">"${STORE}" כולל פריטים שרשומים על אדם ולא נמסרו.</div>` +
              `${tableHead("מיקום")}${summaryRows(list, r => inStore(r) ? STORE : (r.owner_dep ?? "—"), since)}</tbody></table>`;

      html += `<h2>לא דווחו (${missing.length})</h2>`;
      if (!missing.length) {
        html += '<div class="done">כל הפריטים דווחו</div>';
      } else {
        const itemRow = (i, showReg) => `
          <div class="item">
            <span>${i.owner_id != null ? `<a class="lk" href="clearance.html?owner=${encodeURIComponent(i.owner_id)}${i.inventory_label ? "&inv=" + encodeURIComponent(i.inventory_label) : ""}" title="ציוד לפי בעלים">${esc(i.item_name)}</a>` : esc(i.item_name)}${i.serial ? ` <small>#${esc(i.serial)}</small>` : ""}
              <small> · ${esc(i.inventory_label)}</small>
              ${i.attached_to ? `<small> · על ${esc(i.attached_to)}</small>` : ""}
              ${showReg && i.owner_id != null ? `<br><span class="reg">רשום על ${esc(i.owner_name)} (${esc(i.owner_id)}) · לא נמסר</span>` : ""}</span>
            <small>${i.last_report_date ? "דווח לאחרונה " + esc(i.last_report_date) : "מעולם לא דווח"}${i.status_label && i.status_label !== "מושאל" ? " · " + esc(i.status_label) : ""}</small>
            ${i.status_label === "מושאל" ? '<span class="loan">מושאל</span>' : ""}
          </div>`;

        // 1) Everything physically in storage, whether or not it is registered to someone.
        const store = missing.filter(inStore)
          .sort((a, b) => (a.owner_id == null) - (b.owner_id == null) || cmp(a.item_name, b.item_name) || cmp(a.serial, b.serial));
        if (store.length) {
          html += `<div class="group store"><div class="ghead"><span>${STORE}</span><span>${store.length}</span></div>` +
                  store.map(i => itemRow(i, true)).join("") + `</div>`;
        }

        // 2) Items actually in somebody's hands.
        const byOwner = new Map();
        for (const r of missing.filter(r => !inStore(r))) {
          const k = r.owner_id ?? "none";
          if (!byOwner.has(k)) byOwner.set(k, { head: r, items: [] });
          byOwner.get(k).items.push(r);
        }
        html += [...byOwner.values()].sort((a, b) => cmp(a.head.owner_name, b.head.owner_name)).map(({ head: o, items }) =>
          `<div class="group"><div class="ghead"><span>${esc(o.owner_id)}</span><span>${esc(o.owner_name)}</span><span>${esc(o.owner_dep)}</span><a class="go" href="clearance.html?owner=${encodeURIComponent(o.owner_id)}">ציוד לפי בעלים &lsaquo;</a></div>` +
          items.sort((a, b) => cmp(a.item_name, b.item_name)).map(i => itemRow(i, false)).join("") + `</div>`).join("");
      }
    } else {
      html += '<div class="empty">אין פריטים עם מספר סידורי בבחירה הנוכחית</div>';
    }

    if (bulk.length) {
      const m = new Map();
      for (const r of bulk) {
        const k = r.item_name + "|" + (r.inventory_label ?? NO_INV);
        if (!m.has(k)) m.set(k, { name: r.item_name, inv: r.inventory_label ?? NO_INV, total: 0, store: 0, hands: 0, lines: 0, ok: 0, short: 0 });
        const g = m.get(k), n = Number(r.quantity) || 0;
        g.total += n; if (inStore(r)) g.store += n; else g.hands += n;
        const c = countOf(r, since);
        if (c) { g.lines++; if (c.ok) g.ok++; if (c.ok && c.short) g.short++; }
      }
      html += `<h2>פריטים ללא מספר סידורי</h2><div class="note">אומת = השורה של הבעלים נספרה בתאריך שנבחר או אחריו (הספירה נעשית במסך ציוד לפי בעלים). שורות מחסן לא נספרות כך.</div>
        <table><thead><tr><th>פריט</th><th>מלאי</th><th>סה״כ</th><th>${STORE}</th><th>בידיים</th><th>אומת</th></tr></thead><tbody>` +
        [...m.values()].sort((a, b) => cmp(a.inv, b.inv) || b.total - a.total).map(g =>
          `<tr><td>${esc(g.name)}</td><td>${esc(g.inv)}</td><td class="n">${g.total}</td><td class="n">${g.store}</td><td class="n">${g.hands}</td>
          <td class="n ${g.lines - g.ok || g.short ? "miss" : ""}">${g.lines ? `${g.ok} / ${g.lines}${g.short ? ` · ${g.short} חסר` : ""}` : "&mdash;"}</td></tr>`).join("") +
        `</tbody></table>`;
    }
    $("body").innerHTML = html;
  }

  // On a background refresh keep showing the last good data and just say the update failed.
  function fail(isRefresh, message) {
    if (isRefresh) { $("updated").textContent = `העדכון נכשל, מוצגים נתונים מ-${lastOk}`; return; }
    $("body").innerHTML = `<div class="error">לא ניתן לטעון נתונים: ${esc(message)}</div>`;
  }

  async function load(isRefresh) {
    const all = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await db.from("unit_report_check_v").select("*").order("row_id").range(from, from + 999);
      if (error) return fail(isRefresh, error.message);
      all.push(...data);
      if (data.length < 1000) break;
    }
    // The by-person view already knows whether each item was handed over (custody), and for
    // non-serial lines it also has the quantity. Its row ids match this view's ("u" + unit id).
    const held = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await db.from("inventory_holdings_v")
        .select("row_id,item_name,quantity,inventory_label,custody,owner_id,owner_dep")
        .order("row_id").range(from, from + 999);
      if (error) return fail(isRefresh, error.message);
      held.push(...data);
      if (data.length < 1000) break;
    }
    const custodyById = new Map(held.map(h => [h.row_id, h.custody]));
    rows = all.map(r => ({ ...r, custody: custodyById.get(r.row_id) }));
    bulkRows = held.filter(h => h.row_id.startsWith("s"));

    // Owner counts exist only for signed-in users; without them the column shows a dash.
    stockById = new Map(); latestCount = new Map();
    try {
      await (window.RS && RS.first);
      if (window.RS && RS.session) {
        const page = async (table, cols) => {
          const out = [];
          for (let from = 0; ; from += 1000) {
            const { data, error } = await RS.db.from(table).select(cols).order("id").range(from, from + 999);
            if (error) throw error; out.push(...data); if (data.length < 1000) break;
          }
          return out;
        };
        const [st, cs] = await Promise.all([
          page("stock", "id,inventory_id,item_type_id,holder_user_id,parent_unit_id"),
          page("custody_counts", "id,inventory_id,item_type_id,holder_user_id,parent_unit_id,counted_at,counted_qty,expected_qty"),
        ]);
        stockById = new Map(st.map(r => ["s" + r.id, r]));
        for (const c of cs) { const k = lineKey(c), p = latestCount.get(k); if (!p || c.counted_at >= p.counted_at) latestCount.set(k, c); }
      }
    } catch (e) { /* leave empty */ }

    const tm = new Map();
    for (const r of rows) if (r.item_name && !tm.has("s|" + r.item_name))
      tm.set("s|" + r.item_name, { id: "s|" + r.item_name, name: r.item_name, tracking: "serial" });
    for (const r of bulkRows) if (r.item_name && !tm.has("b|" + r.item_name))
      tm.set("b|" + r.item_name, { id: "b|" + r.item_name, name: r.item_name, tracking: "bulk" });
    types = [...tm.values()].sort((a, b) => cmp(a.name, b.name));
    sel = loadSel();
    fillSelect($("dep"), [...rows, ...bulkRows].map(r => r.owner_dep));
    fillSelect($("inv"), [...rows, ...bulkRows].map(r => r.inventory_label ?? NO_INV));
    if (!isRefresh) {   // restore saved choices once; never overwrite what a user picks later
      const p = loadPrefs();
      $("since").value = p.since || defaultSince();
      for (const id of ["dep", "inv"]) if (p[id] && [...$(id).options].some(o => o.value === p[id])) $(id).value = p[id];
    }
    renderTrackPanel();
    render();
    lastOk = clock(); lastAt = Date.now();
    $("updated").textContent = `עודכן ${lastOk}`;
  }

  function setSel(fn) {
    sel = {};
    types.forEach(t => { sel[t.id] = fn(t); });
    saveSel(); renderTrackPanel(); render();
  }

  ["since", "dep", "inv"].forEach(id => $(id).addEventListener("change", () => { savePrefs(); render(); }));
  $("q").addEventListener("input", render);
  $("trackBox").addEventListener("change", e => {
    const cb = e.target.closest("input[data-id]");
    if (!cb) return;
    sel[cb.dataset.id] = cb.checked;
    // keys are strings in JSON; compare by string
    saveSel(); $("trackSummary").textContent = `פריטים במעקב (${types.filter(isTracked).length} מתוך ${types.length} סוגים)`; render();
  });
  $("selSerial").addEventListener("click", () => { sel = {}; saveSel(); renderTrackPanel(); render(); });
  $("selAll").addEventListener("click", () => setSel(() => true));
  $("selNone").addEventListener("click", () => setSel(() => false));
  load();
  // Auto refresh while the tab is visible; catch up when the tab comes back.
  setInterval(() => { if (!document.hidden) load(true); }, REFRESH_MS);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - lastAt > REFRESH_MS) load(true);
  });
</script>
<script src="auth.js"></script>
</body>
</html>
