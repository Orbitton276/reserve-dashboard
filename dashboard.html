<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כללי מילואים</title>
<style>
  /* RG army green, same as the app: PRIMARY_COLOR #444C38 and PRIMARY_TINT */
  :root { --bg:#fff; --fg:#111; --muted:#666; --line:#e3e5df; --head:#444C38; --headfg:#fff; --card:#f6f7f4; --sub:rgba(68,76,56,.12); --warn:#b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121412; --fg:#eceee8; --muted:#a3a99a; --line:#2b2f27; --head:#444C38; --headfg:#fff; --card:#1b1e19; --sub:rgba(68,76,56,.35); --warn:#f59e0b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  header.site { background:var(--head); color:var(--headfg); }
  header.site .in { max-width:1000px; margin:0 auto; padding:0 16px; display:flex; align-items:center; gap:24px; height:52px; }
  header.site .brand { font-weight:700; font-size:18px; margin-inline-end:8px; }
  header.site a { color:rgba(255,255,255,.75); text-decoration:none; font-size:15px; height:100%; display:flex; align-items:center; border-bottom:3px solid transparent; }
  header.site a:hover { color:#fff; }
  header.site a.active { color:#fff; border-bottom-color:#fff; }
  h1 { font-size:20px; margin:0 0 12px; }
  .filters { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  input, select { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  input:focus, select:focus { outline:2px solid var(--head); outline-offset:1px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin:10px 0 4px; }
  .meta { color:var(--muted); font-size:14px; }
  button.link { background:none; border:0; color:var(--muted); text-decoration:underline; font-size:14px; cursor:pointer; padding:0; }
  .tiles { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:12px 0; }
  .tile .sub { font-size:12px; opacity:.85; }
  .tile { background:var(--head); color:var(--headfg); border-radius:10px; padding:12px; text-align:center; }
  .tile b { display:block; font-size:28px; line-height:1.1; }
  .tile span { font-size:13px; opacity:.85; }
  .section { margin:20px 0; }
  .sh { display:flex; justify-content:space-between; background:var(--sub); border-inline-start:4px solid var(--head); padding:8px 12px; font-weight:700; border-radius:4px; }
  .sh small { font-weight:400; color:var(--muted); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:8px; margin-top:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .card .name { font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .total { font-size:26px; font-weight:700; line-height:1.2; }
  .card .chips { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12px; color:var(--muted); }
  .card .chips .warn { color:var(--warn); font-weight:600; }
  .empty, .error { text-align:center; color:var(--muted); padding:32px 0; }
  .error { color:#c0392b; }
  @media (max-width:560px) { .filters { grid-template-columns:1fr; } .tiles { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header class="site"><div class="in">
  <span class="brand">מילואים</span>
  <a href="index.html">מלאי</a>
  <a href="items.html">כל הפריטים</a>
  <a href="dashboard.html" class="active">כללי</a>
  <a href="check.html">דיווח יומי</a>
  <a href="clearance.html">ציוד לפי בעלים</a>
</div></header>
<main>
  <h1>כללי</h1>
  <div class="filters">
    <input id="q" type="search" placeholder="חיפוש פריט" autocomplete="off">
    <select id="dep" aria-label="מחלקה"><option value="">כל המחלקות</option></select>
    <select id="inv" aria-label="מלאי"><option value="">כל המלאים</option></select>
  </div>
  <div class="bar">
    <span class="meta"><span id="meta"></span> · <span id="updated"></span></span>
    <button class="link" id="reset" type="button">נקה סינון</button>
  </div>
  <div class="tiles" id="tiles"></div>
  <div id="list"><div class="empty">טוען…</div></div>
  <p class="meta" id="note"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // Publishable key is public by design. It can only read the inventory_holdings_v view.
  const SUPABASE_URL = "https://bqibfhhhthfzawzkpsdr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_NYRPrV7chJz-X5MTfyTr9Q_caqJ7A4v";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const NO_INV = "אחר";
  const listEl = document.getElementById("list");
  const tilesEl = document.getElementById("tiles");
  const metaEl = document.getElementById("meta");
  const noteEl = document.getElementById("note");
  const qEl = document.getElementById("q");
  const depEl = document.getElementById("dep");
  const invEl = document.getElementById("inv");
  let rows = [];

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }
  const cmp = (a, b) => String(a ?? "").localeCompare(String(b ?? ""), "he");

  // Keeps the current choice when the options are rebuilt on an auto refresh.
  function fillSelect(el, values) {
    const cur = el.value;
    const first = el.options[0];
    el.innerHTML = "";
    el.appendChild(first);
    [...new Set(values.filter(Boolean))].sort(cmp).forEach(v => {
      const o = document.createElement("option");
      o.value = v; o.textContent = v;
      el.appendChild(o);
    });
    if ([...el.options].some(o => o.value === cur)) el.value = cur;
  }

  const REFRESH_MS = 60000;
  const updatedEl = document.getElementById("updated");
  let lastOk = "", lastAt = 0;
  const clock = () => new Date().toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  // Two places only: in somebody's hands, or in storage.
  //   issued = in the person's hands
  //   store  = in storage. That is nobody's, plus anything registered to a person but never handed over.
  //   listed = the part of "store" that is registered to a person (shown as a note, not counted twice)
  const zero = () => ({ total: 0, issued: 0, store: 0, listed: 0 });
  function add(t, r) {
    const n = Number(r.quantity) || 0;
    t.total += n;
    if (r.custody === "issued") { t.issued += n; return; }
    t.store += n;
    if (r.custody !== "store") t.listed += n;
  }

  function render() {
    const q = qEl.value.trim().toLowerCase();
    const dep = depEl.value, inv = invEl.value;

    const filtered = rows.filter(r => {
      if (dep && r.owner_dep !== dep) return false;
      if (inv && (r.inventory_label ?? NO_INV) !== inv) return false;
      if (q.length > 1 && !String(r.item_name ?? "").toLowerCase().includes(q)) return false;
      return true;
    });

    // inventory -> item -> counts
    const byInv = new Map();
    const all = zero();
    for (const r of filtered) {
      add(all, r);
      const invKey = r.inventory_label ?? NO_INV;
      if (!byInv.has(invKey)) byInv.set(invKey, { sum: zero(), items: new Map() });
      const g = byInv.get(invKey);
      add(g.sum, r);
      const name = r.item_name ?? "—";
      if (!g.items.has(name)) g.items.set(name, zero());
      add(g.items.get(name), r);
    }

    tilesEl.innerHTML = [
      [all.total, "סה״כ", ""], [all.issued, "בידיים (נמסר)", ""],
      [all.store, "במחסן", all.listed ? `מתוכם ${all.listed} רשומים על אדם, לא נמסרו` : ""]
    ].map(([n, l, sub]) => `<div class="tile"><b>${n}</b><span>${l}</span>${sub ? `<br><span class="sub">${sub}</span>` : ""}</div>`).join("");

    metaEl.textContent = `${byInv.size} מלאים`;
    noteEl.textContent = dep ? "פריטים שלא רשומים על אף אחד אינם שייכים למחלקה, ולכן אינם נספרים כשנבחרה מחלקה." : "";
    if (!filtered.length) { listEl.innerHTML = '<div class="empty">אין מה להציג</div>'; return; }

    listEl.innerHTML = [...byInv.entries()].sort((a, b) => cmp(a[0], b[0])).map(([label, g]) => {
      const cards = [...g.items.entries()]
        .filter(([, t]) => t.total > 0)
        .sort((a, b) => b[1].total - a[1].total || cmp(a[0], b[0]))
        .map(([name, t]) => `
          <div class="card">
            <div class="name" title="${esc(name)}">${esc(name)}</div>
            <div class="total">${t.total}</div>
            <div class="chips">
              <span>בידיים ${t.issued}</span>
              <span>במחסן ${t.store}</span>
              ${t.listed ? `<span class="warn">מתוכם רשום על אדם ${t.listed}</span>` : ""}
            </div>
          </div>`).join("");
      return `<div class="section">
        <div class="sh"><span>${esc(label)}</span><small>${g.sum.total}</small></div>
        <div class="cards">${cards}</div></div>`;
    }).join("");
  }

  async function load(isRefresh) {
    // PostgREST caps responses (1000 rows by default), so page through to be safe.
    const all = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await db.from("inventory_holdings_v")
        .select("row_id,owner_dep,item_name,quantity,inventory_label,custody")
        .order("row_id").range(from, from + 999);
      if (error) {
        // On a background refresh keep showing the last good data.
        if (isRefresh) { updatedEl.textContent = `העדכון נכשל, מוצגים נתונים מ-${lastOk}`; return; }
        listEl.innerHTML = `<div class="error">לא ניתן לטעון נתונים: ${esc(error.message)}</div>`; return;
      }
      all.push(...data);
      if (data.length < 1000) break;
    }
    rows = all;
    fillSelect(depEl, rows.map(r => r.owner_dep));
    fillSelect(invEl, rows.map(r => r.inventory_label ?? NO_INV));
    render();
    lastOk = clock(); lastAt = Date.now();
    updatedEl.textContent = `עודכן ${lastOk}`;
  }

  qEl.addEventListener("input", render);
  depEl.addEventListener("change", render);
  invEl.addEventListener("change", render);
  document.getElementById("reset").addEventListener("click", () => {
    qEl.value = ""; depEl.value = ""; invEl.value = ""; render();
  });
  load();
  // Auto refresh while the tab is visible; catch up when the tab comes back.
  setInterval(() => { if (!document.hidden) load(true); }, REFRESH_MS);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - lastAt > REFRESH_MS) load(true);
  });
</script>
<script src="auth.js"></script>
</body>
</html>
