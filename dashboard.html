<!doctype html>
<html lang="en" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserve Dashboard</title>
<style>
  /* RG army green, same as the app: PRIMARY_COLOR #444C38 and PRIMARY_TINT */
  :root { --bg:#fff; --fg:#111; --muted:#666; --line:#e3e5df; --head:#444C38; --headfg:#fff; --card:#f6f7f4; --sub:rgba(68,76,56,.12); --warn:#b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121412; --fg:#eceee8; --muted:#a3a99a; --line:#2b2f27; --head:#444C38; --headfg:#fff; --card:#1b1e19; --sub:rgba(68,76,56,.35); --warn:#f59e0b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  nav { display:flex; gap:8px; margin-bottom:12px; }
  nav a { padding:8px 14px; border-radius:8px; text-decoration:none; color:var(--fg); border:1px solid var(--line); background:var(--card); font-weight:600; font-size:15px; }
  nav a.active { background:var(--head); color:var(--headfg); border-color:var(--head); }
  h1 { font-size:20px; margin:0 0 12px; }
  .filters { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  input, select { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  input:focus, select:focus { outline:2px solid var(--head); outline-offset:1px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin:10px 0 4px; }
  .meta { color:var(--muted); font-size:14px; }
  button.link { background:none; border:0; color:var(--muted); text-decoration:underline; font-size:14px; cursor:pointer; padding:0; }
  .tiles { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin:12px 0; }
  .tile { background:var(--head); color:var(--headfg); border-radius:10px; padding:12px; text-align:center; }
  .tile b { display:block; font-size:28px; line-height:1.1; }
  .tile span { font-size:13px; opacity:.85; }
  .section { margin:20px 0; }
  .sh { display:flex; justify-content:space-between; background:var(--sub); border-inline-start:4px solid var(--head); padding:8px 12px; font-weight:700; border-radius:4px; }
  .sh small { font-weight:400; color:var(--muted); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:8px; margin-top:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .card .name { font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .total { font-size:26px; font-weight:700; line-height:1.2; }
  .card .chips { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12px; color:var(--muted); }
  .card .chips .warn { color:var(--warn); font-weight:600; }
  .empty, .error { text-align:center; color:var(--muted); padding:32px 0; }
  .error { color:#c0392b; }
  @media (max-width:560px) { .filters { grid-template-columns:1fr; } .tiles { grid-template-columns:repeat(2, 1fr); } }
</style>
</head>
<body>
<main>
  <nav>
    <a href="index.html">לפי אדם</a>
    <a href="dashboard.html" class="active">לוח מחוונים</a>
  </nav>
  <h1>Reserve Dashboard</h1>
  <div class="filters">
    <input id="q" type="search" placeholder="Search item" autocomplete="off">
    <select id="dep" aria-label="Department"><option value="">All departments</option></select>
    <select id="inv" aria-label="Inventory"><option value="">All inventories</option></select>
  </div>
  <div class="bar">
    <span class="meta" id="meta"></span>
    <button class="link" id="reset" type="button">Reset filters</button>
  </div>
  <div class="tiles" id="tiles"></div>
  <div id="list"><div class="empty">Loading...</div></div>
  <p class="meta" id="note"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // Publishable key is public by design. It can only read the inventory_holdings_v view.
  const SUPABASE_URL = "https://bqibfhhhthfzawzkpsdr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_NYRPrV7chJz-X5MTfyTr9Q_caqJ7A4v";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const NO_INV = "Other";
  const listEl = document.getElementById("list");
  const tilesEl = document.getElementById("tiles");
  const metaEl = document.getElementById("meta");
  const noteEl = document.getElementById("note");
  const qEl = document.getElementById("q");
  const depEl = document.getElementById("dep");
  const invEl = document.getElementById("inv");
  let rows = [];

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }
  const cmp = (a, b) => String(a ?? "").localeCompare(String(b ?? ""), "he");

  function fillSelect(el, values) {
    const first = el.options[0];
    el.innerHTML = "";
    el.appendChild(first);
    [...new Set(values.filter(Boolean))].sort(cmp).forEach(v => {
      const o = document.createElement("option");
      o.value = v; o.textContent = v;
      el.appendChild(o);
    });
  }

  // One row's quantity goes into exactly one bucket.
  //   issued   = in the person's hands
  //   listed   = committed to a person but not handed over (a partly-handed bulk line counts here)
  //   store    = with nobody
  function bucket(r) {
    if (r.custody === "store") return "store";
    if (r.custody === "issued") return "issued";
    return "listed";
  }
  const zero = () => ({ total: 0, issued: 0, listed: 0, store: 0 });
  function add(t, r) {
    const n = Number(r.quantity) || 0;
    t.total += n;
    t[bucket(r)] += n;
  }

  function render() {
    const q = qEl.value.trim().toLowerCase();
    const dep = depEl.value, inv = invEl.value;

    const filtered = rows.filter(r => {
      if (dep && r.owner_dep !== dep) return false;
      if (inv && (r.inventory_label ?? NO_INV) !== inv) return false;
      if (q.length > 1 && !String(r.item_name ?? "").toLowerCase().includes(q)) return false;
      return true;
    });

    // inventory -> item -> counts
    const byInv = new Map();
    const all = zero();
    for (const r of filtered) {
      add(all, r);
      const invKey = r.inventory_label ?? NO_INV;
      if (!byInv.has(invKey)) byInv.set(invKey, { sum: zero(), items: new Map() });
      const g = byInv.get(invKey);
      add(g.sum, r);
      const name = r.item_name ?? "—";
      if (!g.items.has(name)) g.items.set(name, zero());
      add(g.items.get(name), r);
    }

    tilesEl.innerHTML = [
      [all.total, "סה״כ"], [all.issued, "נמסר"], [all.listed, "לא נמסר"], [all.store, "במחסן"]
    ].map(([n, l]) => `<div class="tile"><b>${n}</b><span>${l}</span></div>`).join("");

    metaEl.textContent = `${byInv.size} inventories`;
    noteEl.textContent = dep ? "Items in storage have no department, so they are not counted when a department is selected." : "";
    if (!filtered.length) { listEl.innerHTML = '<div class="empty">Nothing to show</div>'; return; }

    listEl.innerHTML = [...byInv.entries()].sort((a, b) => cmp(a[0], b[0])).map(([label, g]) => {
      const cards = [...g.items.entries()]
        .filter(([, t]) => t.total > 0)
        .sort((a, b) => b[1].total - a[1].total || cmp(a[0], b[0]))
        .map(([name, t]) => `
          <div class="card">
            <div class="name" title="${esc(name)}">${esc(name)}</div>
            <div class="total">${t.total}</div>
            <div class="chips">
              <span>נמסר ${t.issued}</span>
              <span class="${t.listed ? "warn" : ""}">לא נמסר ${t.listed}</span>
              <span>במחסן ${t.store}</span>
            </div>
          </div>`).join("");
      return `<div class="section">
        <div class="sh"><span>${esc(label)}</span><small>${g.sum.total}</small></div>
        <div class="cards">${cards}</div></div>`;
    }).join("");
  }

  async function load() {
    // PostgREST caps responses (1000 rows by default), so page through to be safe.
    const all = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await db.from("inventory_holdings_v")
        .select("row_id,owner_dep,item_name,quantity,inventory_label,custody")
        .order("row_id").range(from, from + 999);
      if (error) { listEl.innerHTML = `<div class="error">Could not load data: ${esc(error.message)}</div>`; return; }
      all.push(...data);
      if (data.length < 1000) break;
    }
    rows = all;
    fillSelect(depEl, rows.map(r => r.owner_dep));
    fillSelect(invEl, rows.map(r => r.inventory_label ?? NO_INV));
    render();
  }

  qEl.addEventListener("input", render);
  depEl.addEventListener("change", render);
  invEl.addEventListener("change", render);
  document.getElementById("reset").addEventListener("click", () => {
    qEl.value = ""; depEl.value = ""; invEl.value = ""; render();
  });
  load();
</script>
</body>
</html>
